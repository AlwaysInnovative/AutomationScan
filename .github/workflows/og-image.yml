name: Generate social preview PNG

on:
  push:
    branches: [main]
    paths:
      - 'og-image.svg'
      - '.github/workflows/og-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick og-image.svg -background none -density 144 og-image.png
          else
            convert og-image.svg -background none -density 144 og-image.png
          fi
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PNG social preview"
          git push
