name: Production Acceptance
# Full production certification matrix - no coverage reduction.
# Final certification v4 after decision-engine overlap fix.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/production-acceptance.js'
      - '.github/workflows/production-acceptance.yml'
      - '*.html'
      - '*.js'
      - 'api/**'
  workflow_dispatch:

jobs:
  production-acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { industry: retail, country: AE }
          - { industry: retail, country: DE }
          - { industry: retail, country: GB }
          - { industry: retail, country: IN }
          - { industry: retail, country: SG }
          - { industry: retail, country: US }
          - { industry: manufacturing, country: AE }
          - { industry: manufacturing, country: DE }
          - { industry: manufacturing, country: GB }
          - { industry: manufacturing, country: IN }
          - { industry: manufacturing, country: SG }
          - { industry: manufacturing, country: US }
          - { industry: healthcare, country: AE }
          - { industry: healthcare, country: DE }
          - { industry: healthcare, country: GB }
          - { industry: healthcare, country: IN }
          - { industry: healthcare, country: SG }
          - { industry: healthcare, country: US }
          - { industry: financial_services, country: AE }
          - { industry: financial_services, country: DE }
          - { industry: financial_services, country: GB }
          - { industry: financial_services, country: IN }
          - { industry: financial_services, country: SG }
          - { industry: financial_services, country: US }
          - { industry: professional_services, country: AE }
          - { industry: professional_services, country: DE }
          - { industry: professional_services, country: GB }
          - { industry: professional_services, country: IN }
          - { industry: professional_services, country: SG }
          - { industry: professional_services, country: US }
          - { industry: logistics, country: AE }
          - { industry: logistics, country: DE }
          - { industry: logistics, country: GB }
          - { industry: logistics, country: IN }
          - { industry: logistics, country: SG }
          - { industry: logistics, country: US }
          - { industry: generic, country: AE }
          - { industry: generic, country: DE }
          - { industry: generic, country: GB }
          - { industry: generic, country: IN }
          - { industry: generic, country: SG }
          - { industry: generic, country: US }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ACCEPTANCE_INDUSTRY: ${{ matrix.industry }}
      ACCEPTANCE_COUNTRY: ${{ matrix.country }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run production customer acceptance
        run: node scripts/production-acceptance.js
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-${{ github.sha }}
          path: |
            test-artifacts/**
            acceptance-summary.json
            acceptance-report.html
          if-no-files-found: warn