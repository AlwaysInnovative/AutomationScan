name: Validate AutomationScan

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js api/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Fail if retired static intelligence is referenced
        run: |
          set -e
          if grep -RIn --exclude-dir=.git "intelligence-data.js\|AutomationScanIntelligence" .; then
            echo "Retired static intelligence reference found."
            exit 1
          fi
      - name: Check required dynamic API files
        run: |
          test -f api/workbench.js
          test -f supabase/workbench.sql
      - name: Validate sitemap XML
        run: python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("sitemap.xml")
          print("sitemap.xml OK")
        PY
